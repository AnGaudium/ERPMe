# Package rules for every regime of l10n_vn (accounting_regime null; ADR-0016 rule 9; ADR-0039 rule 9).
- key: reversal.method
  value: storno
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-05, DS-06) Reversal: storno (negative amounts) or swapped debit and credit?"

- key: reversal.locked_period_posting_date
  value: first_day_of_earliest_open_period
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-05, DS-06) Posting date of a reversal when the original document's period is locked."

- key: reversal.material_document_value
  value: original_line_value
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-05, DS-06) Value of a reversed material document."

- key: posting_date.default.purchase_invoice
  value: last_day_of_document_month_if_open
  effective_from: 2026-01-01
  author_decision: {reference: "open-questions (DS-03, DS-19, DS-22) purchase invoice posting date", date: 2026-11-14, by: "Vinh An Tran"}

- key: posting_date.default.purchase_invoice_month_closed
  value: first_day_of_earliest_open_period
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-03, DS-12, DS-19, DS-22) When the invoice's month is already closed (soft-locked or locked), which posting date should a late purchase invoice default to?"

- key: posting_date.default.other
  value: document_date
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-03, DS-19, DS-23) Which date places a purchase or sales document in a VAT period?"

- key: attachment_retention_years
  value: 10
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-36) Attachment retention"

# --- Documents (ADR-0053 rule 8): invoice law, so every regime ---
- key: documents.issuance_without_delay
  value: true
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-22, DS-24) Issuance without delay: must sales invoices and their correction documents be issued without waiting for an approval"

- key: documents.e_invoice_required
  value: {sales_invoice: true, sales_return: true, credit_note: true, debit_note: true}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-22, DS-24) E-invoice required: which sales documents must be issued as e-invoices before they post"

# --- Tax (ADR-0041 rule 5) ---
# The non-cash payment threshold is a deductibility rule in tax/deductibility_rules.yaml (ADR-0053 rule 3).
- key: tax.rate_date_basis
  value: {sales_invoice: invoice_date, purchase_invoice: supplier_invoice_date, customs_declaration: declaration_date, correction: original_line_tax_date}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-23) Tax date and declaration date"

- key: tax.declaration_date_basis
  value: {sale: invoice_date, purchase: invoice_date, import: tax_payment_voucher_date}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-03, DS-19, DS-23) Which date places a purchase or sales document in a VAT period?"

- key: tax.rounding_level
  value: line
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-23) VAT rounding level"

- key: tax.stated_amount_tolerance
  value: {per_line_minor_units: 1}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-23) Input VAT and non-cash payment"

- key: tax.apportionment
  value: {taxable_boxes: ["29", "30", "32"], total_boxes: ["26", "29", "30", "32"], true_up: fiscal_year_end}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-23) Input VAT and non-cash payment"

- key: tax.return_period
  value: {options: [monthly, quarterly], default: monthly}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-23) Tax date and declaration date"

- key: documents.unit_name_max_length
  value: null
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-40, DS-24) Vietnamese unit names on prints and e-invoices"

# --- Intake and data processing (ADR-0057 rules 20, 30): Vietnamese values of core-registered keys ---
- key: data_processing.policy
  value: {internal: {allowed: true, assessment_for_cross_border: false}, personal: {allowed: true, assessment_for_cross_border: true}, sensitive_personal: {allowed: false, assessment_for_cross_border: true}}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-40, DS-32) The data-processing policy of l10n_vn: does cross-border processing of personal data by a model provider need a filed transfer impact assessment"

- key: intake.e_invoice_formats
  value: {formats: [{code: tct_1450_1510, root_element: HDon, selection: schema_version, signer_subject: seller_tax_id}], unknown_version: review}
  effective_from: 2026-07-01
  status: unverified
