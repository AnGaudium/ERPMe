# Draft manifest of l10n_vn (DS-14 format; ADR-0039). Moves to l10n/l10n_vn/manifest.yaml at step 1.
code: l10n_vn
name: Vietnam
country: VN
version: 0.1.0
core_version: ">=0.1,<0.2"
license: AGPL-3.0
languages: [vi]
regimes:
  - code: tt99
    name: Circular 99/2025/TT-BTC
legal_forms:
  - code: joint_stock
    name_en: Joint-stock company
    name_vi: Công ty cổ phần
    legal_source: {document: Law on Enterprises 59/2020/QH14, article: "Article 111", date: 2021-01-01}
  - code: limited_liability
    name_en: Limited liability company
    name_vi: Công ty trách nhiệm hữu hạn
    legal_source: {document: Law on Enterprises 59/2020/QH14, article: "Articles 46, 74", date: 2021-01-01}
  - code: private_enterprise
    name_en: Private enterprise
    name_vi: Doanh nghiệp tư nhân
    legal_source: {document: Law on Enterprises 59/2020/QH14, article: "Article 188", date: 2021-01-01}
  - code: partnership
    name_en: Partnership
    name_vi: Công ty hợp danh
    legal_source: {document: Law on Enterprises 59/2020/QH14, article: "Article 177", date: 2021-01-01}
components:
  chart_template: regimes/{regime}/chart_template.csv
  account_determination: regimes/{regime}/account_determination.csv
  unreached_system_accounts: regimes/{regime}/unreached_system_accounts.csv
  valuation_classes: regimes/{regime}/valuation_classes.csv
  item_groups: regimes/{regime}/item_groups.csv
  partner_groups: regimes/{regime}/partner_groups.csv
  close_checklist: regimes/{regime}/close_checklist.yaml
  regime_settings: ["settings.yaml", "regimes/{regime}/settings.yaml"]
  numbering: numbering.yaml
  translations: i18n
