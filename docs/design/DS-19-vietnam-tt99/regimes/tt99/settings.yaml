# Regime settings of l10n_vn, regime tt99 (ADR-0016 rules 9-12; ADR-0039 rule 9).
# All unverified: allowed in test and simulation, refused in production until the author verifies them.

- key: fx.transaction_rate.date_basis
  value: posting_date
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-19) Which business date selects the transaction rate under TT99"

- key: fx.transaction_rate.quote
  value: {debit_items: buy_transfer, credit_items: sell_transfer, max_rate_age_days: 7}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-19) Which published quote (buy, sell, transfer or average) does each rate type use under TT99"

- key: fx.revaluation_rate.date_basis
  value: period_end_date
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-19) Which published quote (buy, sell, transfer or average) does each rate type use under TT99"

- key: fx.revaluation_rate.quote
  value: {debit_items: buy_transfer, credit_items: sell_transfer, max_rate_age_days: 7}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-19) Which published quote (buy, sell, transfer or average) does each rate type use under TT99"

- key: fx.document_rate.allowed
  value: {options: [never, within_tolerance], default: never, tolerance_percent: "1"}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-19) Which published quote (buy, sell, transfer or average) does each rate type use under TT99"

- key: fx.book_rate_method
  value: {open_item_accounts: specific, balance_accounts: moving_average}
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-19, DS-25, DS-44) Book rate method for foreign-currency cash and bank balances under TT99"

- key: fx.realized_fx_basis
  value: original
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10) Period-end FX revaluation: reverse at the start of the next period and repost, or post only the delta?"

- key: fx.revaluation.frequency
  value: fiscal_year_end
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-12, DS-19) Under TT99, are foreign-currency items revalued at every period end or only at fiscal year end"

- key: fx.revaluation.method
  value: reverse_and_repost
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10) Period-end FX revaluation: reverse at the start of the next period and repost, or post only the delta?"

- key: fx.revaluation.target
  value: profit_or_loss
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-19) If the TT99 regime holds revaluation differences in 413 first"

- key: fx.revaluation.scope
  value:
    per_open_item: [receivable_trade, receivable_intercompany, receivable_employee_advance, receivable_loan, payable_trade, payable_intercompany]
    # financial_investment_other also holds equity securities (121, 2281), which are not monetary: they are excluded per item (open question).
    per_balance: [cash_on_hand, cash_in_bank, cash_in_transit, financial_investment_other, deposit_paid, receivable_other, payable_deposit, payable_other, payable_employee, accrued_expense, borrowing, liability_other]
    default: none
  effective_from: 2026-01-01
  status: unverified
  open_question: "(DS-10, DS-12, DS-19) Under TT99, are foreign-currency items revalued at every period end or only at fiscal year end"

- key: fx.import_receipt.rate
  value: transaction
  effective_from: 2026-01-01
  status: unverified
